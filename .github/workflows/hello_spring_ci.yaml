name: Hello Spring CI

on:
  #   workflow_dispatch:
  push:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test
        working-directory: /docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: /docker/app1-hello/springboot/hello-spring/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: checkout code
        run: echo "Hello, World!"

      - name: Setup JDK 17
        run: echo "Hello, World!"

      - name: Build Jar for docker
        run: echo "Hello, World!"

      - name: login to docker hub
        run: echo "Hello, World!"

      - name: built and push docker image
        run: echo "Hello, World!"
